<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AI Producer Studio">
  <rect width="512" height="512" fill="#000000"/>
  <path fill="#C17A12" d="M256 48 L464 256 L256 464 L48 256 Z"/>
  <!-- Microphone body -->
  <g transform="translate(256 250) rotate(-38)">
    <!-- Grille / head -->
    <ellipse cx="0" cy="-58" rx="42" ry="52" fill="#0A0A0A"/>
    <g fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round">
      <line x1="-32" y1="-78" x2="32" y2="-78"/>
      <line x1="-36" y1="-58" x2="36" y2="-58"/>
      <line x1="-32" y1="-38" x2="32" y2="-38"/>
    </g>
    <!-- Handle -->
    <path fill="#0A0A0A" d="M-16 -8 C-18 18 -14 68 -10 98 C-8 112 -2 120 0 122 C2 120 8 112 10 98 C14 68 18 18 16 -8 Z"/>
    <!-- Neck connector -->
    <ellipse cx="0" cy="-6" rx="20" ry="14" fill="#0A0A0A"/>
    <!-- Tip -->
    <circle cx="0" cy="128" r="10" fill="#0A0A0A"/>
  </g>
  <!-- Music notes -->
  <g fill="#0A0A0A">
    <!-- Left note -->
    <ellipse cx="148" cy="210" rx="18" ry="14" transform="rotate(-18 148 210)"/>
    <rect x="160" y="120" width="8" height="92" rx="2"/>
    <path d="M168 120 L210 108 L210 118 L168 130 Z"/>
    <!-- Right note -->
    <ellipse cx="340" cy="300" rx="18" ry="14" transform="rotate(-18 340 300)"/>
    <rect x="352" y="210" width="8" height="92" rx="2"/>
    <path d="M360 210 L402 198 L402 208 L360 220 Z"/>
  </g>
</svg>
