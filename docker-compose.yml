# AP self-hosted: web (Next.js) + production worker
# Usage: docker compose up --build -d
# Worker has no published ports.
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      FFMPEG_PATH: /usr/bin/ffmpeg
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      FFMPEG_PATH: /usr/bin/ffmpeg
      PRODUCE_WORKER: "1"
      PRODUCE_FULL_QUALITY: "1"
      PRODUCE_EXECUTION: worker
      WORKER_TICK_MS: "1200000"
      PRODUCE_JOB_MAX_MS: "1800000"
    # No ports — production worker stays internal
