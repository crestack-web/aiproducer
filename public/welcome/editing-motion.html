<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP Studio – Editing Motion Graphic</title><style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0e0704;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;color:#fff1dc}
#scene{position:relative;width:1280px;height:720px;flex:none;transform-origin:center;overflow:hidden;background:radial-gradient(900px 600px at 15% 100%,#a35a08 0%,#3b2010 45%,#1a0f0a 100%)}
.mascot{position:absolute;left:-30px;bottom:-30px;width:560px;height:560px;animation:bob 3.2s ease-in-out infinite;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
.mascot img{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1.5deg)}}
#capw{position:absolute;left:520px;right:48px;top:52px;height:96px;display:flex;align-items:center}
#cap{font-size:46px;font-weight:800;line-height:1.05;animation:pop .4s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
#steps{position:absolute;left:520px;top:162px;display:flex;gap:10px}
#steps b{font-size:20px;padding:6px 18px;border-radius:99px;border:2px solid #5a3a1c;color:#c9a77a;transition:.3s}
#steps b.on{background:#f59e0b;border-color:#f59e0b;color:#2b1708}
.lane{position:absolute;left:520px;top:340px;width:720px;height:170px;background:#120a05;border:2px solid #4a2f18;border-radius:20px;transition:opacity .4s;--bd:1}
.lane.fade{opacity:0}
.seg{position:absolute;top:12px;bottom:12px;border-radius:13px;background:var(--c,#f59e0b);transition:left 1s cubic-bezier(.6,.05,.25,1),transform .35s,box-shadow .5s,background .5s,width .5s;overflow:hidden;z-index:1}
.seg.lift{transform:translateY(-18px) scale(1.04);z-index:3;box-shadow:0 20px 26px #0008}
.bars{position:absolute;inset:30px 10px 18px;display:flex;align-items:center;gap:3px}
.bars i{flex:1;background:#fff;opacity:.92;border-radius:3px}
.tag{position:absolute;top:5px;left:12px;font-size:17px;font-weight:800;color:#2b1708;opacity:0;transition:opacity .4s}
.seg.named .tag{opacity:1}
.fxb{position:absolute;right:10px;bottom:4px;font-size:15px;font-weight:800;color:#fff;background:#0006;border-radius:8px;padding:0 9px;opacity:0;transition:opacity .4s}
.seg[class*="fx-"] .fxb{opacity:1}
.seg[class*="fx-"] .tag{color:#fff}
.fx-reverb{--c:#14b8a6;box-shadow:0 0 34px #14b8a6cc}
.fx-echo{--c:#8b5cf6;box-shadow:12px 0 0 -4px #8b5cf699,24px 0 0 -8px #8b5cf655}
.fx-pitch{background:linear-gradient(90deg,#ec4899,#f97316,#ec4899);background-size:200% 100%;animation:slide 1.6s linear infinite;box-shadow:0 0 28px #ec4899aa}
@keyframes slide{to{background-position:-200% 0}}
.live .bars i{animation:pulse .8s ease-in-out infinite;animation-delay:var(--d)}
@keyframes pulse{50%{transform:scaleY(.5)}}
.cut{position:absolute;top:-10px;bottom:-10px;width:0;border-left:3px dashed #f59e0b;opacity:0;z-index:4}
.cut.flash{animation:fl .9s ease-out}
@keyframes fl{0%{opacity:1;filter:drop-shadow(0 0 10px #f59e0b)}100%{opacity:0}}
.scis{position:absolute;top:-92px;width:70px;height:84px;margin-left:-35px;opacity:0;transform:translateY(-24px);transition:left .7s cubic-bezier(.6,.05,.25,1),opacity .35s,transform .35s;z-index:5;filter:drop-shadow(0 6px 6px #0006)}
.scis.show{opacity:1;transform:none}
.scis .b1,.scis .b2{transform-origin:20px 18px}
.scis.snip .b1{animation:c1 .3s ease-in-out 2}
.scis.snip .b2{animation:c2 .3s ease-in-out 2}
@keyframes c1{50%{transform:rotate(-13deg)}}
@keyframes c2{50%{transform:rotate(13deg)}}
.head{position:absolute;top:4px;bottom:4px;width:4px;left:0;margin-left:-2px;background:#fff1dc;border-radius:2px;opacity:0;z-index:6;box-shadow:0 0 14px #f59e0b}
.head.go{opacity:1;transition:left 3.4s linear}
#chips{position:absolute;left:520px;top:548px;display:flex;gap:14px}
.chip{display:flex;align-items:center;gap:10px;padding:10px 22px;border-radius:18px;border:2px solid #5a3a1c;font-weight:700;font-size:24px;color:#c9a77a;transition:.35s}
.chip i{width:16px;height:16px;border-radius:50%;background:var(--k);opacity:.5}
.chip.on{color:#fff1dc;border-color:var(--k);transform:scale(1.08);box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 30%,transparent)}
.chip.on i{opacity:1}
</style>
<style>
  /* Welcome page embed */
  html, body {
    height: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    background: #0e0704 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  #scene {
    /* fit() script scales; ensure full area */
    max-width: 100%;
  }
</style>
