<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP Singing and Dancing</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0e0704;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#scene{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:radial-gradient(1000px 640px at 50% 105%,#9a5207 0%,#35200f 48%,#150b06 100%)}
.spot{position:absolute;top:-30px;width:440px;height:800px;background:linear-gradient(to bottom,rgba(255,214,120,.55),rgba(255,214,120,0) 85%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transform-origin:50% 0;mix-blend-mode:screen;animation:swing 4.8s ease-in-out infinite alternate}
.spot.l{left:110px;--a:-16deg;--b:12deg}.spot.r{left:730px;--a:-12deg;--b:16deg;animation-duration:5.6s;background:linear-gradient(to bottom,rgba(255,140,200,.45),rgba(255,140,200,0) 85%)}
@keyframes swing{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
.floor{position:absolute;left:190px;top:560px;width:900px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,190,70,.75),rgba(255,150,30,.25) 60%,transparent);animation:hue 9s linear infinite}
@keyframes hue{0%,100%{filter:hue-rotate(0)}50%{filter:hue-rotate(-40deg)}}
.shadow{position:absolute;left:470px;top:668px;width:340px;height:44px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);animation:sh 1.2s ease-in-out infinite}
@keyframes sh{0%,50%,100%{transform:scale(1.05)}25%,75%{transform:scale(.8);opacity:.6}}
#roam{position:absolute;left:320px;top:62px;width:640px;height:640px;animation:roam 4.8s ease-in-out infinite alternate}
@keyframes roam{from{transform:translateX(-70px)}to{transform:translateX(70px)}}
.cub{position:absolute;inset:0;transform-origin:50% 96%;animation:dance 1.2s ease-in-out infinite}
@keyframes dance{0%{transform:translateY(0) rotate(-5deg) scale(1.03,.96)}25%{transform:translateY(-34px) rotate(0) scale(.97,1.04)}50%{transform:translateY(0) rotate(5deg) scale(1.03,.96)}75%{transform:translateY(-34px) rotate(0) scale(.97,1.04)}100%{transform:translateY(0) rotate(-5deg) scale(1.03,.96)}}
.cub img,.cub svg{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 10px 18px #0007)}
.cub svg{filter:none}
#mouth{transform-box:fill-box;transform-origin:50% 15%;animation:sing 1.8s ease-in-out infinite}
@keyframes sing{0%,100%{transform:scaleY(.55)}15%{transform:scaleY(1.5)}30%{transform:scaleY(.7)}48%{transform:scaleY(1.7)}65%{transform:scaleY(.8)}82%{transform:scaleY(1.35)}}
#mic{transform-box:fill-box;transform-origin:50% 90%;animation:mic 1.2s ease-in-out infinite}
@keyframes mic{0%,50%,100%{transform:rotate(-6deg)}25%,75%{transform:rotate(6deg)}}
.ring{fill:none;stroke:#ffc65a;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(3.4)}}
.n{position:absolute;bottom:90px;font-size:44px;font-weight:800;opacity:0;animation:up var(--t) ease-out infinite;animation-delay:var(--d);color:var(--c);text-shadow:0 0 12px var(--c)}
@keyframes up{0%{opacity:0;transform:translate(0,0) rotate(-10deg) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),-520px) rotate(14deg) scale(1.2)}}
.eq{position:absolute;bottom:0;display:flex;align-items:flex-end;gap:7px;height:220px}
.eq i{width:16px;border-radius:6px 6px 0 0;background:linear-gradient(#ffc65a,#f59e0b 60%,#b45f06);height:100%;transform-origin:bottom;animation:eq var(--s) ease-in-out infinite alternate;animation-delay:var(--d);opacity:.85}
@keyframes eq{from{transform:scaleY(.12)}to{transform:scaleY(var(--h))}}
.st{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px #ffd98a;animation:tw 2s ease-in-out infinite;animation-delay:var(--d)}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:6s!important}}
</style>
<style>
  /* Welcome page embed */
  html, body {
    height: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    background: #0e0704 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  #scene {
    width: 1280px !important;
    height: 720px !important;
    flex: none !important;
    transform-origin: center center !important;
  }
  #ap-audio-ui {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(20,12,6,.82);
    border: 1px solid rgba(245,158,11,.35);
    color: #fff1dc;
    font: 600 12px/1 system-ui,sans-serif;
    backdrop-filter: blur(8px);
    cursor: pointer;
    user-select: none;
  }
  #ap-audio-ui:hover { border-color: #f59e0b; }
</style>

function fit(){
  if(!sc)return;
  var s=Math.min((innerWidth||1)/1280,(innerHeight||1)/720);
  sc.style.transform='scale('+s+')';
  sc.style.transformOrigin='center center';
}
fit();addEventListener('resize',fit);setTimeout(fit,50);setTimeout(fit,300);
var seed=11;function r(){seed=seed*16807%2147483647;return seed/2147483647}
var ch=['♪','♫','♬'],co=['#ffc65a','#5eead4','#f9a8d4','#c4b5fd'],h='';
for(var i=0;i<14;i++)h+='<span class="n" style="left:'+(300+r()*680|0)+'px;--x:'+((r()-.5)*260|0)+'px;--t:'+(3.6+r()*2).toFixed(1)+'s;--d:'+(-r()*6).toFixed(1)+'s;--c:'+co[i%4]+'">'+ch[i%3]+'</span>';
document.getElementById('notes').innerHTML=h;
['eqL','eqR'].forEach(function(id){var s='';for(var i=0;i<9;i++)s+='<i style="--h:'+(.3+r()*.7).toFixed(2)+';--s:'+(.35+r()*.5).toFixed(2)+'s;--d:'+(-r()).toFixed(2)+'s"></i>';document.getElementById(id).innerHTML=s});
h='';for(var i=0;i<22;i++)h+='<i class="st" style="left:'+(r()*1250|0)+'px;top:'+(r()*420|0)+'px;--d:'+(-r()*2).toFixed(2)+'s"></i>';document.getElementById('stars').innerHTML=h;

<audio id="apSong" src="/welcome/ap-singing-only-you.mp3" preload="auto" loop playsinline></audio>
<button type="button" id="ap-audio-ui" aria-label="Toggle song">♪ Play song</button>
<script>
(function(){
  var audio=document.getElementById('apSong');
  var btn=document.getElementById('ap-audio-ui');
  var wantPlay=false;
  function setUi(){
    if(!btn||!audio)return;
    btn.textContent = (!audio.paused) ? '♪ Pause' : '♪ Play song';
  }
  function tryPlay(){
    if(!audio)return;
    wantPlay=true;
    var p=audio.play();
    if(p&&p.catch)p.catch(function(){ setUi(); });
    setUi();
  }
  function pause(){
    wantPlay=false;
    if(audio){ try{ audio.pause(); }catch(e){} }
    setUi();
  }
  if(btn){
    btn.addEventListener('click', function(){
      if(!audio)return;
      if(audio.paused) tryPlay(); else pause();
    });
  }
  // Parent welcome page can postMessage {type:'ap-singing', action:'play'|'pause'}
  window.addEventListener('message', function(ev){
    var d=ev&&ev.data;
    if(!d||d.type!=='ap-singing')return;
    if(d.action==='play') tryPlay();
    else if(d.action==='pause') pause();
  });
  // Auto-attempt when visible (may require user gesture on some browsers)
  tryPlay();
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ if(audio&&!audio.paused) audio.pause(); setUi(); }
    else if(wantPlay) tryPlay();
  });
})();
</script>
